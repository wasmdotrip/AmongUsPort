<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity WebGL Player | Among Us</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=540 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Among Us</div>
      </div>
    </div>
    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/AmongUsWeb.loader.js";
      var config = {
        dataUrl: null,
        frameworkUrl: buildUrl + "/AmongUsWeb.framework.js",
        codeUrl: null,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Innersloth",
        productName: "Among Us",
        productVersion: "2026.6.5",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        container.className = "unity-desktop";
      }

      loadingBar.style.display = "block";

      var nativeFetch = window.fetch.bind(window);
      var NativeXMLHttpRequest = window.XMLHttpRequest;
      var NativeWebSocket = window.WebSocket;

      var overrideServer = new URLSearchParams(location.search).get("server");
      var serverReplacement = null;
      if (overrideServer) {
        try { serverReplacement = new URL(overrideServer); } catch (e) {}
      }

      function toHttpProtocol(protocol) {
        if (protocol === "ws:") return "http:";
        if (protocol === "wss:") return "https:";
        return protocol;
      }

      function toWsProtocol(protocol) {
        if (protocol === "http:") return "ws:";
        if (protocol === "https:") return "wss:";
        return protocol;
      }

      function rewriteToServer(url, wantWs) {
        if (!serverReplacement) return url;
        var target;
        try { target = new URL(url, location.href); } catch (e) { return url; }
        if (target.protocol === "blob:") return url;
        if (target.host === location.host) return url;
        target.protocol = wantWs ? toWsProtocol(serverReplacement.protocol) : toHttpProtocol(serverReplacement.protocol);
        target.host = serverReplacement.host;
        return target.toString();
      }

      if (serverReplacement) {
        window.WebSocket = function(url, protocols) {
          var target = rewriteToServer(url, true);
          return protocols !== undefined
            ? new NativeWebSocket(target, protocols)
            : new NativeWebSocket(target);
        };
        window.WebSocket.prototype = NativeWebSocket.prototype;

        window.XMLHttpRequest = function() {
          var xhr = new NativeXMLHttpRequest();
          var originalOpen = xhr.open;
          xhr.open = function(method, url) {
            var target = rewriteToServer(String(url), false);
            var args = Array.prototype.slice.call(arguments);
            args[1] = target;
            return originalOpen.apply(xhr, args);
          };
          return xhr;
        };
        window.XMLHttpRequest.prototype = NativeXMLHttpRequest.prototype;
      }

      async function combinePartsToBlob(baseUrl, partCount, mimeType, partNumberWidth) {
        var responses = await Promise.all(Array.from({ length: partCount }, (_, index) => {
          var partNumber = String(index + 1).padStart(partNumberWidth || 0, "0");
          var partUrl = baseUrl + ".part" + partNumber;
          return nativeFetch(partUrl).then((response) => {
            if (!response.ok) {
              throw new Error("Failed to load " + partUrl + " (HTTP " + response.status + ")");
            }
            return response.arrayBuffer();
          });
        }));
        return new Blob(responses, { type: mimeType });
      }

      async function combineParts(baseUrl, partCount, mimeType, partNumberWidth) {
        var blob = await combinePartsToBlob(baseUrl, partCount, mimeType, partNumberWidth);
        return URL.createObjectURL(blob);
      }

      var splitBundles = {
  "defaultlocalgroup_assets__3b418cde0fb1f79ef4bf74d7b77f3e5b.bundle": {
    partCount: 34,
    partNumberWidth: 2,
    blobPromise: null
  }
};

      window.fetch = function(resource, options) {
        var requestUrl = typeof resource === "string" ? resource : resource.url;
        var cleanUrl = requestUrl.split("?")[0].split("#")[0];
        var fileName = cleanUrl.substring(cleanUrl.lastIndexOf("/") + 1);
        var splitBundle = splitBundles[fileName];
        if (!splitBundle) {
          var rewritten = rewriteToServer(requestUrl, false);
          if (rewritten !== requestUrl) return nativeFetch(rewritten, options);
          return nativeFetch(resource, options);
        }
        if (!splitBundle.blobPromise) {
          splitBundle.blobPromise = combinePartsToBlob(
            cleanUrl,
            splitBundle.partCount,
            "application/octet-stream",
            splitBundle.partNumberWidth
          ).catch((error) => {
            splitBundle.blobPromise = null;
            throw error;
          });
        }
        return splitBundle.blobPromise.then((blob) => new Response(blob, {
          status: 200,
          headers: {
            "Content-Type": "application/octet-stream",
            "Content-Length": String(blob.size)
          }
        }));
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = async () => {
        try {
          var combinedUrls = await Promise.all([
            combineParts(buildUrl + "/AmongUsWeb.data", 6, "application/octet-stream"),
            combineParts(buildUrl + "/AmongUsWeb.wasm", 9, "application/wasm")
          ]);
          config.dataUrl = combinedUrls[0];
          config.codeUrl = combinedUrls[1];
        } catch (error) {
          loadingBar.style.display = "none";
          unityShowBanner(error.message, "error");
          return;
        }
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                loadingBar.style.display = "none";
                fullscreenButton.onclick = () => {
                  unityInstance.SetFullscreen(1);
                };
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
