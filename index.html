<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Among Us</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=540 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div id="unity-loading-status" role="status">Downloading game… 0%</div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var loadingStatus = document.querySelector("#unity-loading-status");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/AmongUsWeb.loader.js";
      var config = {
        dataUrl: null,
        frameworkUrl: buildUrl + "/AmongUsWeb.framework.js",
        codeUrl: null,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Innersloth",
        productName: "Among Us",
        productVersion: "2026.6.5",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        container.className = "unity-desktop";
      }

      loadingBar.style.display = "block";
      canvas.style.visibility = "hidden";

      var nativeFetch = window.fetch.bind(window);
      var NativeXMLHttpRequest = window.XMLHttpRequest;
      var NativeWebSocket = window.WebSocket;

      var overrideServer = new URLSearchParams(location.search).get("server");
      var serverReplacement = null;
      if (overrideServer) {
        try { serverReplacement = new URL(overrideServer); } catch (e) {}
      }

      function toHttpProtocol(protocol) {
        if (protocol === "ws:") return "http:";
        if (protocol === "wss:") return "https:";
        return protocol;
      }

      function toWsProtocol(protocol) {
        if (protocol === "http:") return "ws:";
        if (protocol === "https:") return "wss:";
        return protocol;
      }

      function rewriteToServer(url, wantWs) {
        if (!serverReplacement) return url;
        var target;
        try { target = new URL(url, location.href); } catch (e) { return url; }
        if (target.protocol === "blob:") return url;
        if (target.host === location.host) return url;
        target.protocol = wantWs ? toWsProtocol(serverReplacement.protocol) : toHttpProtocol(serverReplacement.protocol);
        target.host = serverReplacement.host;
        return target.toString();
      }

      if (serverReplacement) {
        window.WebSocket = function(url, protocols) {
          var target = rewriteToServer(url, true);
          return protocols !== undefined
            ? new NativeWebSocket(target, protocols)
            : new NativeWebSocket(target);
        };
        window.WebSocket.prototype = NativeWebSocket.prototype;

        window.XMLHttpRequest = function() {
          var xhr = new NativeXMLHttpRequest();
          var originalOpen = xhr.open;
          xhr.open = function(method, url) {
            var target = rewriteToServer(String(url), false);
            var args = Array.prototype.slice.call(arguments);
            args[1] = target;
            return originalOpen.apply(xhr, args);
          };
          return xhr;
        };
        window.XMLHttpRequest.prototype = NativeXMLHttpRequest.prototype;
      }

      var streamingAssetFiles = [
        {
                "url": "StreamingAssets/aa/AddressablesLink/link.xml",
                "bytes": 28931,
                "type": "application/xml"
        },
        {
                "url": "StreamingAssets/aa/catalog.json",
                "bytes": 1099514,
                "type": "application/json"
        },
        {
                "url": "StreamingAssets/aa/settings.json",
                "bytes": 844,
                "type": "application/json"
        },
        {
                "url": "StreamingAssets/aa/WebGL/453b0a9b2ef9b8a4080b2014844ce426_unitybuiltinshaders_2536dfd3f978a44e0658621a7478bc60.bundle",
                "bytes": 56557,
                "type": "application/octet-stream"
        },
        {
                "url": "StreamingAssets/CustomAssetPacksData.json",
                "bytes": 137,
                "type": "application/json"
        },
        {
                "url": "StreamingAssets/UnityServicesProjectConfiguration.json",
                "bytes": 1131,
                "type": "application/json"
        }
];
      var downloadTotalBytes = 106373377 + 166806921 + 589939296 +
        streamingAssetFiles.reduce((sum, file) => sum + file.bytes, 0);
      var downloadedBytes = 0;
      var downloadProgressFrame = null;
      var loadingFailed = false;
      var preloadAbort = new AbortController();
      var streamingAssetCache = new Map();

      function showLoadingProgress(progress, message) {
        progressBarFull.style.width = Math.round(progress * 100) + "%";
        loadingStatus.textContent = message;
      }

      function recordDownloadedBytes(bytes) {
        if (loadingFailed) return;
        downloadedBytes += bytes;
        if (downloadProgressFrame !== null) return;
        downloadProgressFrame = requestAnimationFrame(() => {
          downloadProgressFrame = null;
          var progress = Math.min(downloadedBytes / downloadTotalBytes, 1);
          showLoadingProgress(progress * 0.85, "Downloading game… " + Math.floor(progress * 100) + "%");
        });
      }

      async function downloadBlob(url, mimeType) {
        var response = await nativeFetch(url, { signal: preloadAbort.signal, cache: "no-cache" });
        if (!response.ok) throw new Error("Failed to load " + url + " (HTTP " + response.status + ")");
        if (!response.body || !response.body.getReader) {
          var buffer = await response.arrayBuffer();
          recordDownloadedBytes(buffer.byteLength);
          return new Blob([buffer], { type: mimeType });
        }
        var reader = response.body.getReader();
        var chunks = [];
        try {
          while (true) {
            var chunk = await reader.read();
            if (chunk.done) break;
            chunks.push(chunk.value);
            recordDownloadedBytes(chunk.value.byteLength);
          }
        } finally {
          reader.releaseLock();
        }
        return new Blob(chunks, { type: mimeType });
      }

      async function combinePartsToBlob(baseUrl, partCount, mimeType, partNumberWidth) {
        var responses = await Promise.all(Array.from({ length: partCount }, (_, index) => {
          var partNumber = String(index + 1).padStart(partNumberWidth || 0, "0");
          var partUrl = baseUrl + ".part" + partNumber;
          return downloadBlob(partUrl, mimeType);
        }));
        return new Blob(responses, { type: mimeType });
      }

      async function combineParts(baseUrl, partCount, mimeType, partNumberWidth) {
        var blob = await combinePartsToBlob(baseUrl, partCount, mimeType, partNumberWidth);
        return URL.createObjectURL(blob);
      }

      var splitBundles = {
  "defaultlocalgroup_assets__db69efd6d6015cdfb90e3e77a7544e5b.bundle": {
    partCount: 34,
    partNumberWidth: 2,
    blobPromise: null
  }
};

      function bundleBlob(baseUrl, splitBundle) {
        if (!splitBundle.blobPromise) {
          splitBundle.blobPromise = combinePartsToBlob(
            baseUrl, splitBundle.partCount, "application/octet-stream", splitBundle.partNumberWidth
          ).catch((error) => {
            splitBundle.blobPromise = null;
            throw error;
          });
        }
        return splitBundle.blobPromise;
      }

      function blobResponse(blob) {
        return new Response(blob, {
          status: 200,
          headers: { "Content-Type": blob.type, "Content-Length": String(blob.size) }
        });
      }

      async function preloadStreamingAssets() {
        var regularFiles = streamingAssetFiles.map(async (file) => {
          var url = new URL(file.url, location.href).href;
          var promise = downloadBlob(url, file.type);
          streamingAssetCache.set(url, promise);
          await promise;
        });
        var bundles = Object.keys(splitBundles).map((fileName) =>
          bundleBlob("StreamingAssets/aa/WebGL/" + fileName, splitBundles[fileName])
        );
        await Promise.all(regularFiles.concat(bundles));
      }

      window.fetch = function(resource, options) {
        var requestUrl = typeof resource === "string" ? resource : resource instanceof URL ? resource.href : resource.url;
        var cleanUrl = requestUrl.split("?")[0].split("#")[0];
        var cached = streamingAssetCache.get(new URL(cleanUrl, location.href).href);
        if (cached) return cached.then(blobResponse);
        var fileName = cleanUrl.substring(cleanUrl.lastIndexOf("/") + 1);
        var splitBundle = splitBundles[fileName];
        if (!splitBundle) {
          var rewritten = rewriteToServer(requestUrl, false);
          if (rewritten !== requestUrl) return nativeFetch(rewritten, options);
          return nativeFetch(resource, options);
        }
        return bundleBlob(cleanUrl, splitBundle).then(blobResponse);
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = async () => {
        try {
          var combinedUrls = await Promise.all([
            combineParts(buildUrl + "/AmongUsWeb.data", 6, "application/octet-stream"),
            combineParts(buildUrl + "/AmongUsWeb.wasm", 9, "application/wasm"),
            preloadStreamingAssets()
          ]);
          config.dataUrl = combinedUrls[0];
          config.codeUrl = combinedUrls[1];
          if (downloadProgressFrame !== null) {
            cancelAnimationFrame(downloadProgressFrame);
            downloadProgressFrame = null;
          }
          showLoadingProgress(0.85, "Starting game…");
          await createUnityInstance(canvas, config, (progress) => {
            showLoadingProgress(0.85 + progress * 0.15, "Starting game…");
          });
          canvas.style.visibility = "visible";
          loadingBar.style.display = "none";
        } catch (error) {
          loadingFailed = true;
          preloadAbort.abort();
          if (downloadProgressFrame !== null) cancelAnimationFrame(downloadProgressFrame);
          loadingStatus.textContent = "Unable to load game";
          unityShowBanner(error.message || String(error), "error");
        }
      };

      document.body.appendChild(script);

    </script>
  </body>
</html>
